<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC Hub Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #F3F4F1; --surface: #FFFFFF; --surface-2: #F7F8F5; --border: #E8EAE4;
    --text: #121512; --text-2: #5F665C; --text-3: #9AA096;
    --g-700: #2F7D22; --g-600: #3E9B2F; --g-500: #5CC23F; --g-400: #86D46B; --g-300: #A9E392; --g-200: #CDEFBF; --g-100: #E6F6DF; --g-50: #F2FBEE;
    --red: #D93C3C; --red-bg: #FDECEC; --amber: #B7791F; --amber-bg: #FDF4E3; --blue: #2B6CB0; --blue-bg: #E8F1FB;
    --radius: 18px; --shadow: 0 1px 2px rgba(18,21,18,.04), 0 4px 16px rgba(18,21,18,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 22px 22px 20px; border-bottom: 1px solid var(--border); }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, var(--g-400), var(--g-600)); display: grid; place-items: center; color: #fff; box-shadow: inset 0 -2px 6px rgba(0,0,0,.12); }
  .logo svg { width: 20px; height: 20px; stroke-width: 2.2; }
  .brand b { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
  .brand small { display: block; color: var(--text-3); font-size: 11.5px; font-weight: 500; }
  .nav { padding: 18px 14px; flex: 1; overflow-y: auto; }
  .nav-label { color: var(--text-3); font-size: 12px; font-weight: 600; margin: 4px 10px 8px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--text-2); font-weight: 600; margin-bottom: 2px; border: 1px solid transparent; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.active { background: var(--g-50); border-color: var(--g-100); color: var(--g-700); }
  .nav a .count { margin-left: auto; background: var(--g-600); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .side-foot { padding: 14px; border-top: 1px solid var(--border); }
  .user-box { display: flex; align-items: center; gap: 10px; padding: 8px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--g-100); color: var(--g-700); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
  .user-box .em { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }

  .main { min-width: 0; }
  .topbar { height: 78px; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  .search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; width: min(360px, 100%); color: var(--text-3); background: var(--surface); }
  .search input { border: none; outline: none; flex: 1; min-width: 0; background: none; color: var(--text); }
  .icon-btn.menu-toggle { display: none; }
  td.sub-text { white-space: nowrap; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 26px 28px 20px; border-bottom: 1px solid var(--border); }
  .page-head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  .page-head p { margin: 4px 0 0; color: var(--text-2); }
  .content { padding: 22px 28px 60px; display: grid; gap: 20px; }

  /* ---------- Generic UI ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .card-head h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
  .card-body { padding: 20px 22px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 18px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: linear-gradient(180deg, var(--g-500), var(--g-600)); border-color: var(--g-600); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.primary:hover { background: var(--g-600); }
  .btn.danger { color: var(--red); }
  .btn.sm { padding: 7px 13px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn.danger:hover { color: var(--red); background: var(--red-bg); border-color: #F6CFCF; }
  .icon-btn svg.i { width: 16px; height: 16px; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
  .seg button { border: none; background: none; padding: 7px 15px; border-radius: 999px; color: var(--text-2); font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
  .pill.green { background: var(--g-100); color: var(--g-700); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.blue { background: var(--blue-bg); color: var(--blue); }
  .muted { color: var(--text-3); }
  .sub-text { color: var(--text-2); font-size: 12.5px; }
  .empty { text-align: center; color: var(--text-3); padding: 38px 16px; }
  .empty b { display: block; color: var(--text-2); margin-bottom: 4px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select.ctl, input.ctl { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 9px 14px; outline: none; }
  select.ctl:focus, input.ctl:focus { border-color: var(--g-400); }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--text-2); font-size: 13px; padding: 13px 22px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 14px 22px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #FBFCFA; }
  td .name { font-weight: 600; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; }
  .who { display: flex; align-items: center; gap: 12px; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .secret { display: inline-flex; align-items: center; gap: 6px; }
  .secret button { border: none; background: none; color: var(--text-3); padding: 2px; display: inline-grid; }
  .secret button:hover { color: var(--text); }
  .secret svg.i { width: 15px; height: 15px; }

  /* ---------- Dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi { display: flex; gap: 14px; align-items: center; padding: 18px; }
  .kpi-ico { width: 50px; height: 50px; border-radius: 14px; border: 1px solid var(--border); display: grid; place-items: center; color: var(--text); background: var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.04); flex: none; }
  .kpi-ico svg.i { width: 22px; height: 22px; }
  .kpi label { color: var(--text-2); font-size: 13px; }
  .kpi .val { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .kpi .val b { font-size: 27px; font-weight: 700; letter-spacing: -.6px; }
  .delta { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--g-100); color: var(--g-700); }
  .delta.neg { background: var(--red-bg); color: var(--red); }
  .row-2 { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr); gap: 20px; }
  .row-3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 20px; }
  .big-num { font-size: 30px; font-weight: 700; letter-spacing: -.8px; margin-top: 6px; }
  .chart { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 18px 22px 16px; }
  .y-axis { display: flex; flex-direction: column-reverse; justify-content: space-between; height: 270px; color: var(--text-2); font-size: 12.5px; text-align: right; padding-bottom: 26px; }
  .y-axis span { line-height: 0; }
  .plot { position: relative; height: 270px; }
  .grid-lines { position: absolute; inset: 0 0 26px 0; display: flex; flex-direction: column-reverse; justify-content: space-between; pointer-events: none; }
  .grid-lines div { border-top: 1px dashed var(--border); }
  .bars { position: absolute; inset: 0 0 0 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end; }
  .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; }
  .bar { border-radius: 10px; background: linear-gradient(180deg, var(--g-50), var(--g-100)); border: 1px solid var(--g-100); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 12.5px; font-weight: 500; color: var(--text); min-height: 30px; transition: height .4s ease; }
  .bar.hl { background: linear-gradient(180deg, var(--g-400), var(--g-600)); border-color: var(--g-600); color: #fff; }
  .bar-x { text-align: center; color: var(--text-2); font-size: 12.5px; height: 26px; line-height: 26px; letter-spacing: .5px; }
  .gauge-wrap { position: relative; display: grid; place-items: center; padding: 14px 10px 4px; }
  .gauge-wrap svg { width: 230px; height: 230px; }
  .gauge-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -42%); text-align: center; }
  .gauge-center b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
  .gauge-center span { color: var(--text-2); font-size: 13px; }
  .health-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
  .health-stats div { padding: 14px 22px; }
  .health-stats div + div { border-left: 1px solid var(--border); }
  .health-stats b { display: block; font-size: 20px; font-weight: 700; }
  .donut-row { display: flex; align-items: center; gap: 24px; padding: 22px; flex-wrap: wrap; }
  .donut { width: 168px; height: 168px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .donut div { width: 104px; height: 104px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; text-align: center; }
  .donut b { font-size: 24px; font-weight: 800; display: block; }
  .legend { flex: 1; min-width: 180px; }
  .legend div { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .legend div:last-child { border-bottom: none; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend em { font-style: normal; font-weight: 600; }
  .stars { color: #E9A23B; letter-spacing: 1px; white-space: nowrap; }
  .stars .off { color: #DADDD6; }

  /* ---------- Menu ---------- */
  .menu-cat { padding: 0; }
  .menu-cat + .menu-cat { border-top: 1px solid var(--border); }
  .cat-title { padding: 14px 22px; font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--text-2); text-transform: uppercase; background: var(--surface-2); border-bottom: 1px solid var(--border); }
  .menu-item { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--border); }
  .menu-item:last-child { border-bottom: none; }
  .menu-item .info { flex: 1; min-width: 0; }
  .menu-item .info p { margin: 3px 0 6px; color: var(--text-2); font-size: 13px; }
  .menu-item .price { font-weight: 700; white-space: nowrap; }
  .menu-item.off .info, .menu-item.off .price { opacity: .45; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #D7DAD3; border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch span::after { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--g-500); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .loc-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .loc-tabs button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 8px 15px; white-space: nowrap; font-weight: 600; color: var(--text-2); }
  .loc-tabs button.on { background: var(--g-50); border-color: var(--g-300); color: var(--g-700); }

  /* ---------- Feedback ---------- */
  .fb { padding: 18px 22px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
  .fb:last-child { border-bottom: none; }
  .fb.new { background: linear-gradient(90deg, var(--g-50), transparent 40%); }
  .fb-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fb-top .meta { flex: 1; min-width: 160px; }
  .fb-msg { line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .fb-reply { background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--g-500); border-radius: 10px; padding: 10px 14px; font-size: 13px; white-space: pre-wrap; }
  .fb-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fb-actions select { padding: 6px 12px; font-size: 13px; }
  .mini-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .mini-kpis .card { padding: 16px 18px; }
  .mini-kpis label { color: var(--text-2); font-size: 13px; }
  .mini-kpis b { display: block; font-size: 24px; font-weight: 700; margin-top: 4px; }

  /* ---------- Modal / toast / login ---------- */
  .modal { position: fixed; inset: 0; background: rgba(18,21,18,.38); display: grid; place-items: center; padding: 16px; z-index: 50; backdrop-filter: blur(2px); }
  .modal-card { background: var(--surface); border-radius: 20px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-body { padding: 20px 22px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal-foot { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }
  .field { grid-column: 1 / -1; display: grid; gap: 6px; }
  .field.half { grid-column: auto; }
  .field > span { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .field small { color: var(--text-3); font-size: 12px; }
  .field input, .field select, .field textarea { border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; background: var(--surface-2); outline: none; width: 100%; }
  .field textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--g-400); background: var(--surface); box-shadow: 0 0 0 3px var(--g-50); }
  .check { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--g-600); }
  .toasts { position: fixed; bottom: 20px; right: 20px; display: grid; gap: 8px; z-index: 60; }
  .toast { background: var(--text); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 360px; animation: pop .2s ease; }
  .toast.err { background: var(--red); }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(900px 500px at 20% 0%, var(--g-100), transparent), var(--bg); }
  .login .card { width: min(400px, 100%); padding: 32px 28px; }
  .login h1 { margin: 22px 0 4px; font-size: 24px; letter-spacing: -.4px; }
  .login p { color: var(--text-2); margin: 0 0 22px; }
  .login .field { margin-bottom: 14px; }
  .login .btn { width: 100%; justify-content: center; padding: 13px; }
  .status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
  .status.err { color: var(--red); }
  .setup { padding: 24px; line-height: 1.6; }
  .setup code { background: var(--surface-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1180px) {
    .kpis, .mini-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-2, .row-3 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    .app.nav-open .sidebar { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.3); }
    .icon-btn.menu-toggle { display: inline-grid; }
    .topbar { padding: 0 16px; height: 66px; }
    .page-head { padding: 20px 16px 16px; }
    .page-head h1 { font-size: 22px; }
    .content { padding: 16px 16px 48px; }
    th, td { padding: 12px 14px; }
    .bars { gap: 4px; }
    .bar { font-size: 10.5px; border-radius: 7px; }
    .bar-x { font-size: 10.5px; letter-spacing: 0; }
  }
  @media (max-width: 560px) {
    .kpis, .mini-kpis { grid-template-columns: minmax(0, 1fr); }
    .modal-body { grid-template-columns: 1fr; }
    .field.half { grid-column: 1 / -1; }
    .bar span { display: none; }
  }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<div id="login" class="login hidden">
  <div class="card">
    <div class="logo" id="login-logo"></div>
    <h1>Masuk ke NFC Hub</h1>
    <p>Dashboard admin untuk klien, lokasi, menu, dan feedback.</p>
    <form onsubmit="doLogin(event)">
      <label class="field"><span>Email</span><input id="login-email" type="email" required autocomplete="username"></label>
      <label class="field"><span>Password</span><input id="login-password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Masuk</button>
    </form>
    <div class="status" id="login-status"></div>
  </div>
</div>

<!-- ============ App ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" id="side-logo"></div>
      <div><b>NFC Hub</b><small>Admin dashboard</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="user-box">
        <div class="avatar" id="user-initial"></div>
        <div class="em" id="user-email"></div>
        <button class="icon-btn" title="Keluar" onclick="doLogout()" id="logout-btn"></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" onclick="document.getElementById('app').classList.toggle('nav-open')"></button>
      <label class="search" id="global-search"></label>
    </div>
    <div class="page-head" id="page-head"></div>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden" onclick="if (event.target === this) closeModal()"></div>
<div class="toasts" id="toasts"></div>

<script>
  // ============================================================
  // Helpers
  // ============================================================
  var sb = supabaseClient;
  var ICONS = {
    logo: '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/>',
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',

  function icon(name) { return '<svg class="i" viewBox="0 0 24 24">' + ICONS[name] + '</svg>'; }
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rupiah(n) { return n == null ? '—' : 'Rp ' + Number(n).toLocaleString('id-ID'); }
  function fmtDate(d) { return new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function fmtDateTime(d) { return new Date(d).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  function stars(r) { if (!r) return '<span class="muted">—</span>'; var s = ''; for (var i = 1; i <= 5; i++) s += i <= r ? '★' : '<span class="off">★</span>'; return '<span class="stars">' + s + '</span>'; }
  function initials(s) { return (s || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); }
  function toast(msg, type) {
    var el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg;
    $('toasts').appendChild(el); setTimeout(function () { el.remove(); }, 3200);
  }
  async function run(query) {
    var res = await query;
    if (res.error) { toast(res.error.message, 'err'); throw res.error; }
    return res.data;
  }
  var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES'];
  var STATUS = { new: ['Baru', 'green'], read: ['Dibaca', ''], replied: ['Dibalas', 'blue'], resolved: ['Selesai', 'amber'] };
  var GREENS = ['#3E9B2F', '#6CC94F', '#A9E392', '#CDEFBF', '#E6F6DF'];

  // ============================================================
  // State
  // ============================================================
  var S = {
    user: null, clients: [], locations: [], menu: [], feedback: [],
    search: '', chartSrc: 'all', menuLoc: null, locClient: '',
    fb: { loc: '', source: '', status: '', rating: '' }
  };
  function clientById(id) { return S.clients.find(function (c) { return c.id === id; }); }
  function locById(id) { return S.locations.find(function (l) { return l.id === id; }); }
  function locLabel(id) { var l = locById(id); return l ? l.name : 'Tanpa lokasi'; }
  function matches(obj, keys) {
    if (!S.search) return true;
    var q = S.search.toLowerCase();
    return keys.some(function (k) { return String(obj[k] || '').toLowerCase().indexOf(q) !== -1; });
  }

  // ============================================================
  // Auth
  // ============================================================
  async function doLogin(e) {
    e.preventDefault();
    var st = $('login-status'); st.className = 'status'; st.textContent = 'Sedang masuk…';
    var res = await sb.auth.signInWithPassword({ email: $('login-email').value.trim(), password: $('login-password').value });
    if (res.error) { st.className = 'status err'; st.textContent = res.error.message; return; }
    st.textContent = '';
    start();
  }
  async function doLogout() { await sb.auth.signOut(); location.hash = ''; showLogin(); }
  function showLogin() { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }

  async function start() {
    var u = (await sb.auth.getUser()).data.user;
    if (!u) return showLogin();
    S.user = u;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('user-email').textContent = u.email; $('user-initial').textContent = initials(u.email);
    await loadAll();
    route();
    syncStoreConfig();
  }

  // Tables that don't exist yet (schema_v2.sql not run) load as empty lists
  // so every page still renders; a banner explains the missing step.
  async function loadAll() {
    var res = await Promise.all([
      sb.from('clients').select('*').order('created_at'),
      sb.from('locations').select('*').order('created_at'),
      sb.from('menu_items').select('*').order('sort_order').order('created_at'),
      sb.from('feedback').select('*').order('created_at', { ascending: false }).limit(2000)
    ]);
    var err = res.find(function (r) { return r.error; });
    S.setupError = err ? err.error : null;
    S.clients = res[0].data || []; S.locations = res[1].data || []; S.menu = res[2].data || []; S.feedback = res[3].data || [];
    if (S.setupError) await loadLegacy();
  }

  // ---------- Legacy mode: schema.sql only (store_config + feedback) ----------
  // Shows the single store as one client/location and parses menu_text into
  // items. Location, Wi-Fi and menu edits are written back to store_config.
  function parseMenuText(text) {
    return (text || '').split('\n').map(function (line) { return line.split('|').map(function (s) { return s.trim(); }); })
      .filter(function (p) { return p[1]; })
      .map(function (p, idx) {
        var digits = (p[2] || '').replace(/[^0-9]/g, '');
        return { id: 'm' + idx, location_id: 'default', category: p[0] || 'Menu', name: p[1], price: digits ? Number(digits) : null,
                 description: p[3] || '', tags: p[4] || '', is_available: true, sort_order: idx };
      });
  }
  function menuToText(items) {
    var clean = function (v) { return String(v == null ? '' : v).replace(/[|\n\r]/g, ' ').trim(); };
    return (items || S.menu).slice().sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); }).map(function (i) {
      return [clean(i.category), clean(i.name), i.price == null ? '' : 'Rp ' + Number(i.price).toLocaleString('id-ID'), clean(i.description), clean(i.tags)].join('|');
    }).join('\n');
  }
  async function loadLegacy() {
    var cfgRes = await sb.from('store_config').select('*').eq('id', 'default').maybeSingle();
    if (cfgRes.error || !cfgRes.data) return;
    var cfg = cfgRes.data;
    var fbRes = await sb.from('feedback').select('*').order('created_at', { ascending: false }).limit(2000);
    S.legacy = true;
    S.clients = [{ id: 'legacy', name: cfg.store_name, contact_name: '', email: '', phone: '', plan: 'free', status: 'active', notes: '', created_at: cfg.updated_at }];
    S.locations = [{ id: 'default', client_id: 'legacy', name: cfg.store_name, address: cfg.tagline, wifi_ssid: cfg.wifi_ssid, wifi_password: cfg.wifi_password,
                     google_place_id: '', google_review_url: cfg.review_link, is_active: true, created_at: cfg.updated_at }];
    S.menu = parseMenuText(cfg.menu_text);
    S.feedback = (fbRes.data || []).map(function (f) {
      return Object.assign({ location_id: 'default', source: 'nfc', status: 'new', rating: null, author_name: '', admin_reply: '' }, f);
    });
  }
  async function saveLegacy() {
    var l = S.locations[0];
    await run(sb.from('store_config').update({
      store_name: l.name || 'My Store', tagline: l.address || '', wifi_ssid: l.wifi_ssid || '', wifi_password: l.wifi_password || '',
      review_link: l.google_review_url || '', menu_text: menuToText(), updated_at: new Date().toISOString()
    }).eq('id', 'default'));
  }
  // The original single-store table (store_config) is still what older pages
  // read, so mirror the first location (the migrated Kopi Senja one) into it.
  async function syncStoreConfig() {
    if (S.legacy || S.setupError || !S.locations.length) return;
    var l = S.locations[0];
    var payload = {
      store_name: l.name || 'My Store', tagline: l.address || '', wifi_ssid: l.wifi_ssid || '', wifi_password: l.wifi_password || '',
      review_link: writeReviewUrl(l),
      menu_text: menuToText(S.menu.filter(function (i) { return i.location_id === l.id && i.is_available; }))
    };
    var cur = (await sb.from('store_config').select('*').eq('id', 'default').maybeSingle()).data;
    if (!cur || !Object.keys(payload).some(function (k) { return (cur[k] || '') !== payload[k]; })) return;
    payload.updated_at = new Date().toISOString();
    var res = await sb.from('store_config').update(payload).eq('id', 'default');
    if (res.error) console.warn('store_config sync failed', res.error);
  }
  function legacyBlocked() {
    toast('Fitur ini butuh database baru. Jalankan schema_v2.sql di Supabase dulu.', 'err');
    return true;
  }
  async function reload(table) {
    var q = { clients: sb.from('clients').select('*').order('created_at'),
              locations: sb.from('locations').select('*').order('created_at'),
              menu: sb.from('menu_items').select('*').order('sort_order').order('created_at'),
              feedback: sb.from('feedback').select('*').order('created_at', { ascending: false }).limit(2000) }[table];
    S[table] = await run(q);
    if (table === 'locations' || table === 'menu') syncStoreConfig();
  }

  function setupBanner() {
    if (!S.setupError) return '';
    var lead = S.legacy
      ? '<b>Mode data lama.</b> Data dari database sudah tampil; Wi-Fi, lokasi, dan menu bisa diedit. Untuk banyak klien/lokasi dan status feedback, buka'
      : '<b>Database belum di-setup.</b> Data belum bisa disimpan. Buka';
    return '<div class="card setup" style="flex-basis:100%;border-color:#F1D9A6;background:var(--amber-bg);padding:14px 18px;">' + lead + ' <b>Supabase → SQL Editor → New query</b>, tempel isi file <code>schema_v2.sql</code>, klik <b>Run</b>, lalu ' +
      '<button class="btn sm" onclick="location.reload()">Refresh</button></div>';
  }

  // ============================================================
  // Routing / shell
  // ============================================================
  var PAGES = {
    dashboard: { title: 'Dashboard', icon: 'home', render: renderDashboard },
    clients: { title: 'Klien', icon: 'users', render: renderClients },
    locations: { title: 'Lokasi', icon: 'pin', render: renderLocations },
    menu: { title: 'Menu', icon: 'menu', render: renderMenu },
    wifi: { title: 'Wi-Fi', icon: 'wifi', render: renderWifi },
    feedback: { title: 'Feedback', icon: 'chat', render: renderFeedback }
  };
  function current() { var h = location.hash.replace('#', ''); return PAGES[h] ? h : 'dashboard'; }
  function go(page) { if (location.hash === '#' + page) route(); else location.hash = page; }
  window.addEventListener('hashchange', function () { S.search = ''; route(); });

  function route() {
    if (!S.user) return;
    var page = current();
    $('app').classList.remove('nav-open');
    var newCount = S.feedback.filter(function (f) { return f.status === 'new'; }).length;
    $('nav').innerHTML = '<div class="nav-label">Menu utama</div>' + Object.keys(PAGES).map(function (k) {
      var p = PAGES[k];
      var badge = k === 'feedback' && newCount ? '<span class="count">' + newCount + '</span>' : '';
      return '<a href="#' + k + '" class="' + (k === page ? 'active' : '') + '">' + icon(p.icon) + p.title + badge + '</a>';
    }).join('');
    var si = $('search-input');
    if (si && si.value !== S.search) si.value = S.search;
    PAGES[page].render();
  }
  function head(title, sub, actions) {
    $('page-head').innerHTML = '<div><h1>' + esc(title) + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><div class="toolbar">' + (actions || '') + '</div>' + setupBanner();
  }
  function onSearch(v) { S.search = v.trim(); if (current() !== 'dashboard') PAGES[current()].render(); }

  // ============================================================
  // Dashboard
  // ============================================================
  function renderDashboard() {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth();
    var fb = S.feedback;
    var inMonth = function (f, yy, mm) { var d = new Date(f.created_at); return d.getFullYear() === yy && d.getMonth() === mm; };
    var thisMonth = fb.filter(function (f) { return inMonth(f, y, m); }).length;
    var prevMonth = fb.filter(function (f) { return inMonth(f, m === 0 ? y - 1 : y, (m + 11) % 12); }).length;
    var delta = prevMonth ? Math.round((thisMonth - prevMonth) / prevMonth * 100) : null;
    var activeClients = S.clients.filter(function (c) { return c.status === 'active'; }).length;
    var activeLocs = S.locations.filter(function (l) { return l.is_active; }).length;
    var available = S.menu.filter(function (i) { return i.is_available; }).length;

    head('Dashboard', 'Ringkasan semua klien dan lokasi NFC Hub.',
      '<button class="btn" onclick="go(\'feedback\')">' + icon('chat') + 'Lihat feedback</button><button class="btn primary" onclick="clientForm()">' + icon('plus') + 'Tambah klien</button>');

    var kpi = function (ic, label, val, badge) {
      return '<div class="card kpi"><div class="kpi-ico">' + icon(ic) + '</div><div><label>' + label + '</label><div class="val"><b>' + val + '</b>' + (badge || '') + '</div></div></div>';
    };
    var html = '<div class="kpis">' +
      kpi('users', 'Total Klien', S.clients.length, '<span class="delta">' + activeClients + ' aktif</span>') +
      kpi('pin', 'Lokasi Aktif', activeLocs, '<span class="sub-text">dari ' + S.locations.length + '</span>') +
      kpi('menu', 'Item Menu', S.menu.length, '<span class="sub-text">' + available + ' tersedia</span>') +
      kpi('chat', 'Feedback Bulan Ini', thisMonth, delta == null ? '' : '<span class="delta ' + (delta < 0 ? 'neg' : '') + '">' + (delta >= 0 ? '+' : '') + delta + '%</span>') +
      '</div>';

    html += '<div class="row-2"><div class="card" id="chart-card"></div><div class="card" id="health-card"></div></div>';
    html += '<div class="row-3"><div class="card" id="donut-card"></div><div class="card" id="recent-card"></div></div>';
    $('content').innerHTML = html;
    renderChart(); renderHealth(); renderDonut(); renderRecent();
  }

  function niceStep(v) {
    if (v <= 1) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }
  function renderChart() {
    var y = new Date().getFullYear(), cm = new Date().getMonth();
    var src = S.chartSrc;
    var counts = MONTHS.map(function () { return 0; });
    S.feedback.forEach(function (f) {
      var d = new Date(f.created_at);
      if (d.getFullYear() !== y) return;
      if (src !== 'all' && f.source !== src) return;
      counts[d.getMonth()]++;
    });
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    var step = niceStep(Math.max.apply(null, counts) / 5), max = step * 5;
    var ticks = ''; for (var t = 0; t <= 5; t++) ticks += '<span>' + (t * step) + '</span>';
    var lines = ''; for (var g = 0; g <= 5; g++) lines += '<div></div>';
    var bars = counts.map(function (c, i) {
      var h = Math.max(c / max * 100, 0);
      return '<div class="bar-col"><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;">' +
        '<div class="bar ' + (i === cm ? 'hl' : '') + '" style="height:calc(' + h + '% + 0px)" title="' + MONTHS[i] + ': ' + c + ' feedback"><span>' + c + '</span></div></div>' +
        '<div class="bar-x">' + MONTHS[i] + '</div></div>';
    }).join('');
    var seg = function (k, label) { return '<button class="' + (src === k ? 'on' : '') + '" onclick="S.chartSrc=\'' + k + '\';renderChart()">' + label + '</button>'; };
    $('chart-card').innerHTML =
      '<div class="card-head" style="border-bottom:none;padding-bottom:6px;"><div><h3>Volume Feedback ' + y + '</h3><div class="big-num">' + total.toLocaleString('id-ID') + '</div></div>' +
      '<div class="seg">' + seg('all', 'Semua') + seg('nfc', 'NFC') + seg('google', 'Google') + '</div></div>' +
      '<div class="chart"><div class="y-axis">' + ticks + '</div><div class="plot"><div class="grid-lines">' + lines + '</div><div class="bars">' + bars + '</div></div></div>';
  }

  function gaugeSvg(value, max) {
    var n = 34, filled = Math.round(n * (value || 0) / max), out = '';
    for (var i = 0; i < n; i++) {
      var a = (135 + 270 * i / (n - 1)) * Math.PI / 180;
      var x1 = 100 + 70 * Math.cos(a), y1 = 100 + 70 * Math.sin(a), x2 = 100 + 90 * Math.cos(a), y2 = 100 + 90 * Math.sin(a);
      var col = i < filled ? (i / n < .4 ? '#CDEFBF' : i / n < .7 ? '#A9E392' : '#6CC94F') : '#EEF0EB';
      out += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="' + col + '" stroke-width="7" stroke-linecap="round"/>';
    }
    return '<svg viewBox="0 0 200 200">' + out + '</svg>';
  }
  function renderHealth() {
    var rated = S.feedback.filter(function (f) { return f.rating; });
    var avg = rated.length ? rated.reduce(function (a, f) { return a + f.rating; }, 0) / rated.length : 0;
    var positive = rated.length ? Math.round(rated.filter(function (f) { return f.rating >= 4; }).length / rated.length * 100) : 0;
    var open = S.feedback.filter(function (f) { return f.status === 'new' || f.status === 'read'; }).length;
    $('health-card').innerHTML = '<div class="card-head" style="border-bottom:none;"><h3>Kepuasan Pelanggan</h3><span class="pill">' + rated.length + ' rating</span></div>' +
      '<div class="gauge-wrap">' + gaugeSvg(avg, 5) + '<div class="gauge-center"><b>' + (rated.length ? avg.toFixed(1) : '—') + '</b><span>dari 5 bintang</span></div></div>' +
      '<div class="health-stats"><div><span class="sub-text">Rating positif</span><b>' + positive + '%</b></div><div><span class="sub-text">Belum ditangani</span><b>' + open + '</b></div></div>';
  }

  function renderDonut() {
    var byLoc = {};
    S.feedback.forEach(function (f) { var k = f.location_id || '_'; byLoc[k] = (byLoc[k] || 0) + 1; });
    var rows = Object.keys(byLoc).map(function (k) { return { label: k === '_' ? 'Tanpa lokasi' : locLabel(k), n: byLoc[k] }; })
      .sort(function (a, b) { return b.n - a.n; });
    if (rows.length > 5) { var rest = rows.splice(4); rows.push({ label: 'Lainnya', n: rest.reduce(function (a, r) { return a + r.n; }, 0) }); }
    var total = S.feedback.length, acc = 0;
    var stops = rows.map(function (r, i) { var from = acc; acc += r.n / total * 100; return GREENS[i] + ' ' + from + '% ' + acc + '%'; }).join(',');
    var body = total ? '<div class="donut-row"><div class="donut" style="background:conic-gradient(' + stops + ')"><div><span><b>' + total + '</b><span class="sub-text">feedback</span></span></div></div>' +
      '<div class="legend">' + rows.map(function (r, i) { return '<div><i style="background:' + GREENS[i] + '"></i><span>' + esc(r.label) + '</span><em>' + Math.round(r.n / total * 100) + '%</em></div>'; }).join('') + '</div></div>'
      : '<div class="empty"><b>Belum ada feedback</b>Feedback dari kartu NFC dan Google akan muncul di sini.</div>';
    $('donut-card').innerHTML = '<div class="card-head"><h3>Feedback per Lokasi</h3></div>' + body;
  }

  function renderRecent() {
    var rows = S.feedback.slice(0, 6);
    $('recent-card').innerHTML = '<div class="card-head"><h3>Feedback Terbaru</h3><button class="btn sm" onclick="go(\'feedback\')">Lihat semua</button></div>' +
      (rows.length ? '<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Lokasi</th><th>Rating</th><th>Tanggal</th><th>Status</th></tr></thead><tbody>' +
        rows.map(function (f) {
          var name = f.author_name || 'Anonim', st = STATUS[f.status] || STATUS.new;
          return '<tr><td><div class="who"><div class="avatar">' + esc(initials(name)) + '</div><div><div class="name">' + esc(name) + '</div><div class="sub-text">' + (f.source === 'google' ? 'Google Review' : 'Kartu NFC') + '</div></div></div></td>' +
            '<td>' + esc(locLabel(f.location_id)) + '</td><td>' + stars(f.rating) + '</td><td class="sub-text">' + fmtDate(f.created_at) + '</td><td><span class="pill ' + st[1] + '">' + st[0] + '</span></td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="empty"><b>Belum ada feedback</b></div>');
  }

  // ============================================================
  // Clients
  // ============================================================
  function renderClients() {
    head('Klien', 'Bisnis yang memakai NFC Hub dan lokasi mereka.', '<button class="btn primary" onclick="clientForm()">' + icon('plus') + 'Tambah klien</button>');
    var rows = S.clients.filter(function (c) { return matches(c, ['name', 'contact_name', 'email', 'phone']); });
    var body = rows.length ? '<div class="table-wrap"><table><thead><tr><th>Klien</th><th>Kontak</th><th>Lokasi</th><th>Paket</th><th>Status</th><th>Bergabung</th><th></th></tr></thead><tbody>' +
      rows.map(function (c) {
        var locs = S.locations.filter(function (l) { return l.client_id === c.id; }).length;
        return '<tr><td><div class="who"><div class="avatar">' + esc(initials(c.name)) + '</div><div><div class="name">' + esc(c.name) + '</div><div class="sub-text">' + esc(c.email || '—') + '</div></div></div></td>' +
          '<td>' + esc(c.contact_name || '—') + '<div class="sub-text">' + esc(c.phone || '') + '</div></td>' +
          '<td><button class="btn sm" onclick="S.locClient=\'' + c.id + '\';go(\'locations\')">' + icon('pin') + locs + ' lokasi</button></td>' +
          '<td><span class="pill">' + esc(c.plan) + '</span></td>' +
          '<td><span class="pill ' + (c.status === 'active' ? 'green' : 'red') + '">' + (c.status === 'active' ? 'Aktif' : 'Nonaktif') + '</span></td>' +
          '<td class="sub-text">' + fmtDate(c.created_at) + '</td>' +
          '<td><div class="actions"><button class="icon-btn" title="Edit" onclick="clientForm(\'' + c.id + '\')">' + icon('edit') + '</button><button class="icon-btn danger" title="Hapus" onclick="deleteClient(\'' + c.id + '\')">' + icon('trash') + '</button></div></td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="empty"><b>' + (S.search ? 'Tidak ada klien yang cocok' : 'Belum ada klien') + '</b>Klik "Tambah klien" untuk memulai.</div>';
    $('content').innerHTML = '<div class="card"><div class="card-head"><h3>Semua klien</h3><span class="pill">' + rows.length + ' klien</span></div>' + body + '</div>';
  }
  function clientForm(id) {
    if (S.legacy && !id) return legacyBlocked();
    if (S.legacy) return locationForm('default');
    var c = id ? clientById(id) : {};
    openForm({
      title: id ? 'Edit klien' : 'Tambah klien', values: c,
      fields: [
        { key: 'name', label: 'Nama bisnis', required: true, placeholder: 'mis. Kopi Senja' },
        { key: 'contact_name', label: 'Nama kontak', half: true },
        { key: 'phone', label: 'No. telepon / WA', half: true },
        { key: 'email', label: 'Email', type: 'email', half: true },
        { key: 'plan', label: 'Paket', type: 'select', half: true, default: 'free', options: [{ value: 'free', label: 'Free' }, { value: 'basic', label: 'Basic' }, { value: 'pro', label: 'Pro' }] },
        { key: 'status', label: 'Status', type: 'select', default: 'active', options: [{ value: 'active', label: 'Aktif' }, { value: 'inactive', label: 'Nonaktif' }] },
        { key: 'notes', label: 'Catatan', type: 'textarea' }
      ],
      onSubmit: async function (v) {
        if (id) await run(sb.from('clients').update(v).eq('id', id)); else await run(sb.from('clients').insert(v));

      }
    });

  async function deleteClient(id) {
    if (S.legacy) return legacyBlocked();
    var c = clientById(id), n = S.locations.filter(function (l) { return l.client_id === id; }).length;
    if (!confirm('Hapus klien "' + c.name + '"?' + (n ? '\n\n' + n + ' lokasi beserta menunya juga akan terhapus.' : ''))) return;
    await run(sb.from('clients').delete().eq('id', id));
    await Promise.all([reload('clients'), reload('locations'), reload('menu'), reload('feedback')]);
    toast('Klien dihapus'); route();
  }

  // ============================================================
  // Locations
  // ============================================================
  function reviewsUrl(l) { return l.google_place_id ? 'https://search.google.com/local/reviews?placeid=' + encodeURIComponent(l.google_place_id) : ''; }
  function writeReviewUrl(l) { return l.google_review_url || (l.google_place_id ? 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(l.google_place_id) : ''); }
  function toggleSecret(btn) { var s = btn.parentNode.querySelector('[data-secret]'); var shown = s.dataset.shown === '1'; s.textContent = shown ? '••••••••' : s.dataset.secret; s.dataset.shown = shown ? '0' : '1'; }
  function copyText(t) { navigator.clipboard.writeText(t).then(function () { toast('Disalin'); }); }

  function renderLocations() {
    head('Lokasi', 'Outlet tiap klien: alamat, Wi-Fi, dan link Google Review.',
      '<select class="ctl" onchange="S.locClient=this.value;renderLocations()"><option value="">Semua klien</option>' +
      S.clients.map(function (c) { return '<option value="' + c.id + '" ' + (S.locClient === c.id ? 'selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' +
      '<button class="btn primary" onclick="locationForm()">' + icon('plus') + 'Tambah lokasi</button>');
    var rows = S.locations.filter(function (l) { return (!S.locClient || l.client_id === S.locClient) && matches(l, ['name', 'address', 'wifi_ssid']); });
    var body = rows.length ? '<div class="table-wrap"><table><thead><tr><th>Lokasi</th><th>Klien</th><th>Wi-Fi</th><th>Google Review</th><th>Menu</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(function (l) {
        var c = clientById(l.client_id), items = S.menu.filter(function (i) { return i.location_id === l.id; }).length;
        var wifi = l.wifi_ssid ? '<div class="name">' + esc(l.wifi_ssid) + '</div><div class="secret sub-text"><span class="mono" data-secret="' + esc(l.wifi_password) + '">••••••••</span>' +
          (l.wifi_password ? '<button title="Lihat" onclick="toggleSecret(this)">' + icon('eye') + '</button><button title="Salin" onclick="copyText(this.parentNode.querySelector(\'[data-secret]\').dataset.secret)">' + icon('copy') + '</button>' : '') + '</div>' : '<span class="muted">Belum diatur</span>';
        var g = writeReviewUrl(l);
        var google = g ? '<a class="btn sm" href="' + esc(g) + '" target="_blank" rel="noopener">' + icon('ext') + 'Buka</a>' : '<span class="muted">—</span>';
        return '<tr><td><div class="name">' + esc(l.name) + '</div><div class="sub-text">' + esc(l.address || '—') + '</div></td>' +
          '<td>' + esc(c ? c.name : '—') + '</td><td>' + wifi + '</td><td>' + google + '</td>' +
          '<td><button class="btn sm" onclick="S.menuLoc=\'' + l.id + '\';go(\'menu\')">' + icon('menu') + items + ' item</button></td>' +
          '<td><span class="pill ' + (l.is_active ? 'green' : 'red') + '">' + (l.is_active ? 'Aktif' : 'Nonaktif') + '</span></td>' +
          '<td><div class="actions"><button class="icon-btn" title="Edit" onclick="locationForm(\'' + l.id + '\')">' + icon('edit') + '</button><button class="icon-btn danger" title="Hapus" onclick="deleteLocation(\'' + l.id + '\')">' + icon('trash') + '</button></div></td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="empty"><b>' + (S.clients.length ? 'Belum ada lokasi' : 'Tambah klien dulu') + '</b>' + (S.clients.length ? 'Klik "Tambah lokasi" untuk menambahkan outlet.' : 'Setiap lokasi harus milik satu klien.') + '</div>';
    $('content').innerHTML = '<div class="card"><div class="card-head"><h3>Daftar lokasi</h3><span class="pill">' + rows.length + ' lokasi</span></div>' + body + '</div>';
  }
  function locationForm(id) {
    if (S.legacy && !id) return legacyBlocked();
    if (!S.clients.length) { toast('Tambah klien dulu sebelum menambah lokasi', 'err'); return clientForm(); }
    var l = id ? locById(id) : { client_id: S.locClient || S.clients[0].id, is_active: true };
    openForm({
      title: id ? 'Edit lokasi' : 'Tambah lokasi', values: l,
      fields: [
        { key: 'client_id', label: 'Klien', type: 'select', required: true, options: S.clients.map(function (c) { return { value: c.id, label: c.name }; }) },
        { key: 'name', label: 'Nama lokasi', required: true, placeholder: 'mis. Kopi Senja Kemang' },
        { key: 'address', label: 'Alamat', type: 'textarea' },
        { key: 'wifi_ssid', label: 'Nama Wi-Fi (SSID)', half: true },
        { key: 'wifi_password', label: 'Password Wi-Fi', half: true },
        { key: 'google_place_id', label: 'Google Place ID', placeholder: 'ChIJ…', hint: 'Cari di developers.google.com/maps/documentation/places/web-service/place-id' },
        { key: 'google_review_url', label: 'Link tulis review Google', type: 'url', hint: 'Kosongkan untuk dibuat otomatis dari Place ID.' },
        { key: 'is_active', label: 'Lokasi aktif (tampil di kartu NFC)', type: 'checkbox' }
      ],
      onSubmit: async function (v) {
        if (S.legacy) {
          Object.assign(S.locations[0], v); S.clients[0].name = v.name;
          await saveLegacy(); toast('Lokasi diperbarui'); return route();
        }
        if (id) await run(sb.from('locations').update(v).eq('id', id)); else await run(sb.from('locations').insert(v));
        await reload('locations'); toast(id ? 'Lokasi diperbarui' : 'Lokasi ditambahkan'); route();
      }
    });
  }
  async function deleteLocation(id) {
    if (S.legacy) return legacyBlocked();
    var l = locById(id);
    if (!confirm('Hapus lokasi "' + l.name + '"?\n\nSemua menu di lokasi ini ikut terhapus. Feedback tetap disimpan.')) return;
    await run(sb.from('locations').delete().eq('id', id));
    await Promise.all([reload('locations'), reload('menu'), reload('feedback')]);
    toast('Lokasi dihapus'); route();
  }

  // ============================================================
  // Menu
  // ============================================================
  function renderMenu() {
    if (!S.locations.length) {
      head('Menu', 'Kelola menu per lokasi.');
      $('content').innerHTML = '<div class="card"><div class="empty"><b>Belum ada lokasi</b>Menu dikelola per lokasi. <br><br><button class="btn primary" onclick="go(\'locations\')">Ke halaman Lokasi</button></div></div>';
      return;
    }
    if (!locById(S.menuLoc)) S.menuLoc = S.locations[0].id;
    var loc = locById(S.menuLoc), client = clientById(loc.client_id);
    head('Menu', 'Kelola menu per lokasi. Perubahan langsung tampil di kartu NFC.',
      '<button class="btn primary" onclick="menuForm()">' + icon('plus') + 'Tambah item</button>');
    var tabs = '<div class="loc-tabs">' + S.locations.map(function (l) {
      return '<button class="' + (l.id === S.menuLoc ? 'on' : '') + '" onclick="S.menuLoc=\'' + l.id + '\';renderMenu()">' + esc(l.name) + '</button>';
    }).join('') + '</div>';
    var items = S.menu.filter(function (i) { return i.location_id === S.menuLoc && matches(i, ['name', 'category', 'description', 'tags']); });
    var cats = [];
    items.forEach(function (i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
    var body = items.length ? cats.map(function (cat) {
      return '<div class="menu-cat"><div class="cat-title">' + esc(cat) + '</div>' + items.filter(function (i) { return i.category === cat; }).map(function (i) {
        var tags = (i.tags || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return '<span class="pill ' + (/best|favorit|vegan/i.test(t) ? 'green' : '') + '">' + esc(t) + '</span>'; }).join('');
        return '<div class="menu-item ' + (i.is_available ? '' : 'off') + '"><div class="info"><div class="name">' + esc(i.name) + '</div>' + (i.description ? '<p>' + esc(i.description) + '</p>' : '') + '<div class="tags">' + tags + '</div></div>' +
          '<div class="price">' + rupiah(i.price) + '</div>' +
          '<label class="switch" title="' + (i.is_available ? 'Tersedia' : 'Habis') + '"><input type="checkbox" ' + (i.is_available ? 'checked' : '') + ' onchange="toggleItem(\'' + i.id + '\', this.checked)"><span></span></label>' +
          '<div class="actions"><button class="icon-btn" title="Edit" onclick="menuForm(\'' + i.id + '\')">' + icon('edit') + '</button><button class="icon-btn danger" title="Hapus" onclick="deleteItem(\'' + i.id + '\')">' + icon('trash') + '</button></div></div>';
      }).join('') + '</div>';
    }).join('') : '<div class="empty"><b>' + (S.search ? 'Tidak ada item yang cocok' : 'Menu masih kosong') + '</b>Klik "Tambah item" untuk menambahkan menu.</div>';
    $('content').innerHTML = tabs + '<div class="card"><div class="card-head"><div><h3>' + esc(loc.name) + '</h3><div class="sub-text">' + esc(client ? client.name : '') + '</div></div><span class="pill">' + items.length + ' item</span></div>' + body + '</div>';
  }
  function menuForm(id) {
    var i = id ? S.menu.find(function (x) { return x.id === id; }) : { location_id: S.menuLoc, is_available: true };
    var cats = S.menu.filter(function (x) { return x.location_id === (i.location_id || S.menuLoc); }).map(function (x) { return x.category; })
      .filter(function (c, idx, arr) { return arr.indexOf(c) === idx; });
    openForm({
      title: id ? 'Edit item menu' : 'Tambah item menu', values: i,
      fields: [
        { key: 'location_id', label: 'Lokasi', type: 'select', required: true, options: S.locations.map(function (l) { return { value: l.id, label: l.name }; }) },
        { key: 'name', label: 'Nama item', required: true, placeholder: 'mis. Kopi Susu Senja' },
        { key: 'category', label: 'Kategori', required: true, half: true, list: cats, placeholder: 'mis. Coffee & Drinks' },
        { key: 'price', label: 'Harga (Rp)', type: 'number', half: true, step: 500, placeholder: '28000' },
        { key: 'description', label: 'Deskripsi', type: 'textarea' },
        { key: 'tags', label: 'Tag', half: true, placeholder: 'Best seller, Vegan', hint: 'Pisahkan dengan koma.' },
        { key: 'sort_order', label: 'Urutan', type: 'number', half: true, default: 0 },
        { key: 'is_available', label: 'Tersedia (tidak habis)', type: 'checkbox' }
      ],
      onSubmit: async function (v) {
        if (v.sort_order == null) v.sort_order = 0;
        if (S.legacy) {
          v.location_id = 'default'; v.is_available = true;
          if (id) Object.assign(S.menu.find(function (x) { return x.id === id; }), v);
          else S.menu.push(Object.assign({ id: 'm' + Date.now() }, v));
          await saveLegacy(); toast(id ? 'Item diperbarui' : 'Item ditambahkan'); return route();
        }
        if (id) await run(sb.from('menu_items').update(v).eq('id', id)); else await run(sb.from('menu_items').insert(v));
        S.menuLoc = v.location_id;
        await reload('menu'); toast(id ? 'Item diperbarui' : 'Item ditambahkan'); route();
      }
    });
  }
  async function toggleItem(id, on) {
    if (S.legacy) { legacyBlocked(); return renderMenu(); }
    await run(sb.from('menu_items').update({ is_available: on }).eq('id', id));
    S.menu.find(function (x) { return x.id === id; }).is_available = on;
    syncStoreConfig();
    toast(on ? 'Item tersedia lagi' : 'Item ditandai habis'); renderMenu();
  }
  async function deleteItem(id) {
    var i = S.menu.find(function (x) { return x.id === id; });
    if (!confirm('Hapus "' + i.name + '" dari menu?')) return;
    if (S.legacy) {
      S.menu = S.menu.filter(function (x) { return x.id !== id; });
      await saveLegacy(); toast('Item dihapus'); return renderMenu();
    }
    await run(sb.from('menu_items').delete().eq('id', id));
    await reload('menu'); toast('Item dihapus'); renderMenu();
  }

  // ============================================================
  // Wi-Fi
  // ============================================================
  function renderWifi() {
    head('Wi-Fi', 'Nama dan password Wi-Fi yang tampil saat pelanggan tap kartu NFC.',
      '<button class="btn primary" onclick="locationForm()">' + icon('plus') + 'Tambah lokasi</button>');
    var rows = S.locations.filter(function (l) { return matches(l, ['name', 'wifi_ssid']); });
    var body = rows.length ? '<div class="table-wrap"><table><thead><tr><th>Lokasi</th><th>Nama Wi-Fi (SSID)</th><th>Password</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(function (l) {
        var c = clientById(l.client_id);
        var pass = l.wifi_password ? '<div class="secret"><span class="mono" data-secret="' + esc(l.wifi_password) + '">••••••••</span>' +
          '<button title="Lihat" onclick="toggleSecret(this)">' + icon('eye') + '</button><button title="Salin" onclick="copyText(this.parentNode.querySelector(\'[data-secret]\').dataset.secret)">' + icon('copy') + '</button></div>' : '<span class="muted">Tanpa password</span>';
        return '<tr><td><div class="name">' + esc(l.name) + '</div><div class="sub-text">' + esc(c ? c.name : '') + '</div></td>' +
          '<td>' + (l.wifi_ssid ? '<div class="who">' + icon('wifi') + '<span class="name">' + esc(l.wifi_ssid) + '</span></div>' : '<span class="pill amber">Belum diatur</span>') + '</td>' +
          '<td>' + (l.wifi_ssid ? pass : '<span class="muted">—</span>') + '</td>' +
          '<td><span class="pill ' + (l.is_active ? 'green' : 'red') + '">' + (l.is_active ? 'Tampil' : 'Disembunyikan') + '</span></td>' +
          '<td><div class="actions"><button class="btn sm" onclick="wifiForm(\'' + l.id + '\')">' + icon('edit') + 'Ubah Wi-Fi</button></div></td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="empty"><b>Belum ada lokasi</b>Wi-Fi diatur per lokasi. Tambah lokasi dulu.</div>';
    $('content').innerHTML = '<div class="card"><div class="card-head"><h3>Wi-Fi per lokasi</h3><span class="pill">' + rows.length + ' lokasi</span></div>' + body + '</div>';
  }
  function wifiForm(id) {
    var l = locById(id);
    openForm({
      title: 'Wi-Fi · ' + l.name, values: l,
      fields: [
        { key: 'wifi_ssid', label: 'Nama Wi-Fi (SSID)', required: true, placeholder: 'mis. KopiSenja_Guest' },
        { key: 'wifi_password', label: 'Password Wi-Fi', hint: 'Kosongkan kalau Wi-Fi tanpa password.' }
      ],
      onSubmit: async function (v) {
        if (S.legacy) { Object.assign(S.locations[0], v); await saveLegacy(); toast('Wi-Fi diperbarui'); return route(); }

        await reload('locations'); toast('Wi-Fi diperbarui'); route();
      }
    });

  // ============================================================
  // Feedback
  // ============================================================
  function renderFeedback() {
    var F = S.fb;
    var opt = function (val, label, cur) { return '<option value="' + esc(val) + '" ' + (String(cur) === String(val) ? 'selected' : '') + '>' + esc(label) + '</option>'; };
    head('Feedback', 'Feedback dari kartu NFC dan review Google per lokasi.',
      '<button class="btn primary" onclick="googleReviewForm()">' + icon('plus') + 'Catat review Google</button>');

    var rows = S.feedback.filter(function (f) {
      return (!F.loc || (F.loc === '_' ? !f.location_id : f.location_id === F.loc)) &&
        (!F.source || f.source === F.source) && (!F.status || f.status === F.status) &&
        (!F.rating || String(f.rating || '') === F.rating) && matches(f, ['message', 'author_name', 'admin_reply']);
    });
    var rated = rows.filter(function (f) { return f.rating; });
    var avg = rated.length ? (rated.reduce(function (a, f) { return a + f.rating; }, 0) / rated.length).toFixed(1) : '—';

    var filters = '<div class="toolbar">' +
      '<select class="ctl" onchange="S.fb.loc=this.value;renderFeedback()">' + opt('', 'Semua lokasi', F.loc) + S.locations.map(function (l) { return opt(l.id, l.name, F.loc); }).join('') + opt('_', 'Tanpa lokasi', F.loc) + '</select>' +
      '<select class="ctl" onchange="S.fb.source=this.value;renderFeedback()">' + opt('', 'Semua sumber', F.source) + opt('nfc', 'Kartu NFC', F.source) + opt('google', 'Google Review', F.source) + '</select>' +
      '<select class="ctl" onchange="S.fb.status=this.value;renderFeedback()">' + opt('', 'Semua status', F.status) + Object.keys(STATUS).map(function (k) { return opt(k, STATUS[k][0], F.status); }).join('') + '</select>' +
      '<select class="ctl" onchange="S.fb.rating=this.value;renderFeedback()">' + opt('', 'Semua rating', F.rating) + [5, 4, 3, 2, 1].map(function (r) { return opt(r, r + ' bintang', F.rating); }).join('') + '</select>' +
      '</div>';

    var list = rows.length ? rows.map(function (f) {
      var st = STATUS[f.status] || STATUS.new, name = f.author_name || 'Anonim', l = locById(f.location_id);
      var gLink = f.source === 'google' && l && reviewsUrl(l) ? '<a class="btn sm" href="' + esc(reviewsUrl(l)) + '" target="_blank" rel="noopener">' + icon('ext') + 'Balas di Google</a>' : '';
      return '<div class="fb ' + (f.status === 'new' ? 'new' : '') + '">' +
        '<div class="fb-top"><div class="avatar">' + esc(initials(name)) + '</div><div class="meta"><div class="name">' + esc(name) + '</div><div class="sub-text">' + esc(locLabel(f.location_id)) + ' · ' + fmtDateTime(f.created_at) + '</div></div>' +
        stars(f.rating) + '<span class="pill ' + (f.source === 'google' ? 'blue' : '') + '">' + (f.source === 'google' ? 'Google' : 'NFC') + '</span><span class="pill ' + st[1] + '">' + st[0] + '</span></div>' +
        '<div class="fb-msg">' + esc(f.message) + '</div>' +
        (f.admin_reply ? '<div class="fb-reply"><b>Balasan / catatan' + (f.replied_at ? ' · ' + fmtDate(f.replied_at) : '') + '</b><br>' + esc(f.admin_reply) + '</div>' : '') +
        '<div class="fb-actions"><select class="ctl" onchange="setStatus(\'' + f.id + '\', this.value)">' + Object.keys(STATUS).map(function (k) { return opt(k, STATUS[k][0], f.status); }).join('') + '</select>' +
        '<button class="btn sm" onclick="replyForm(\'' + f.id + '\')">' + icon('reply') + (f.admin_reply ? 'Edit balasan' : 'Balas / catatan') + '</button>' + gLink +
        '<span style="flex:1"></span><button class="icon-btn danger" title="Hapus" onclick="deleteFeedback(\'' + f.id + '\')">' + icon('trash') + '</button></div></div>';
    }).join('') : '<div class="empty"><b>Tidak ada feedback</b>Coba ubah filter, atau tunggu feedback masuk dari kartu NFC.</div>';

    $('content').innerHTML =
      '<div class="mini-kpis">' +
      '<div class="card"><label>Total</label><b>' + rows.length + '</b></div>' +
      '<div class="card"><label>Baru</label><b>' + rows.filter(function (f) { return f.status === 'new'; }).length + '</b></div>' +
      '<div class="card"><label>Rating rata-rata</label><b>' + avg + '</b></div>' +
      '<div class="card"><label>Dari Google</label><b>' + rows.filter(function (f) { return f.source === 'google'; }).length + '</b></div></div>' +
      filters + '<div class="card">' + list + '</div>';
  }
  async function setStatus(id, status) {
    if (S.legacy) { legacyBlocked(); return renderFeedback(); }
    await run(sb.from('feedback').update({ status: status }).eq('id', id));
    S.feedback.find(function (f) { return f.id === id; }).status = status;
    toast('Status diperbarui'); route();
  }
  function replyForm(id) {
    if (S.legacy) return legacyBlocked();
    var f = S.feedback.find(function (x) { return x.id === id; });
    openForm({
      title: 'Balasan / catatan', values: f, submitLabel: 'Simpan balasan',
      fields: [{ key: 'admin_reply', label: 'Balasan atau catatan tindak lanjut', type: 'textarea', required: true,
        hint: f.source === 'google' ? 'Disimpan di dashboard. Untuk tampil di Google, tempel juga di halaman review Google.' : 'Disimpan untuk tim; feedback NFC bersifat anonim.' }],
      onSubmit: async function (v) {
        await run(sb.from('feedback').update({ admin_reply: v.admin_reply, replied_at: new Date().toISOString(), status: 'replied' }).eq('id', id));
        await reload('feedback'); toast('Balasan disimpan'); route();
      }
    });
  }
  function googleReviewForm() {
    if (S.legacy) return legacyBlocked();
    if (!S.locations.length) { toast('Tambah lokasi dulu', 'err'); return go('locations'); }
    openForm({
      title: 'Catat review Google', values: { location_id: S.fb.loc && S.fb.loc !== '_' ? S.fb.loc : S.locations[0].id, rating: 5, created_at: new Date().toISOString().slice(0, 10) },
      fields: [
        { key: 'location_id', label: 'Lokasi', type: 'select', required: true, options: S.locations.map(function (l) { return { value: l.id, label: l.name }; }) },
        { key: 'author_name', label: 'Nama reviewer', half: true },
        { key: 'rating', label: 'Rating', type: 'select', half: true, options: [5, 4, 3, 2, 1].map(function (r) { return { value: r, label: '★'.repeat(r) + ' (' + r + ')' }; }) },
        { key: 'created_at', label: 'Tanggal review', type: 'date' },
        { key: 'message', label: 'Isi review', type: 'textarea', required: true }
      ],
      onSubmit: async function (v) {
        v.rating = Number(v.rating); v.source = 'google'; v.status = 'new';
        v.created_at = v.created_at ? new Date(v.created_at).toISOString() : new Date().toISOString();
        await run(sb.from('feedback').insert(v));
        await reload('feedback'); toast('Review Google dicatat'); route();
      }
    });
  }
  async function deleteFeedback(id) {
    if (!confirm('Hapus feedback ini secara permanen?')) return;
    if (S.legacy) return legacyBlocked();
    await run(sb.from('feedback').delete().eq('id', id));
    await reload('feedback'); toast('Feedback dihapus'); route();
  }

  // ============================================================
  // Modal form builder
  // ============================================================
  var formFields = [];
  function fieldHtml(f, v) {
    var id = 'f_' + f.key, val = v == null ? (f.default == null ? '' : f.default) : v;
    if (f.type === 'checkbox') return '<label class="check"><input type="checkbox" id="' + id + '" ' + ((v == null ? f.default : v) ? 'checked' : '') + '><span>' + esc(f.label) + '</span></label>';
    var input;
    if (f.type === 'textarea') input = '<textarea id="' + id + '" ' + (f.required ? 'required' : '') + ' placeholder="' + esc(f.placeholder || '') + '">' + esc(val) + '</textarea>';
    else if (f.type === 'select') input = '<select id="' + id + '">' + f.options.map(function (o) { return '<option value="' + esc(o.value) + '" ' + (String(o.value) === String(val) ? 'selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
    else input = '<input id="' + id + '" type="' + (f.type || 'text') + '" value="' + esc(f.type === 'date' ? String(val).slice(0, 10) : val) + '" ' + (f.required ? 'required' : '') +
      ' placeholder="' + esc(f.placeholder || '') + '"' + (f.step ? ' step="' + f.step + '"' : '') + (f.list ? ' list="' + id + '_dl"' : '') + '>' +
      (f.list ? '<datalist id="' + id + '_dl">' + f.list.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' : '');
    return '<label class="field ' + (f.half ? 'half' : '') + '"><span>' + esc(f.label) + (f.required ? ' *' : '') + '</span>' + input + (f.hint ? '<small>' + esc(f.hint) + '</small>' : '') + '</label>';
  }
  function openForm(opts) {
    formFields = opts.fields;
    $('modal').innerHTML = '<div class="modal-card"><div class="modal-head"><h3>' + esc(opts.title) + '</h3><button class="icon-btn" type="button" onclick="closeModal()">' + icon('x') + '</button></div>' +
      '<form class="modal-body" id="modal-form">' + opts.fields.map(function (f) { return fieldHtml(f, opts.values ? opts.values[f.key] : null); }).join('') +
      '<div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit" id="modal-submit">' + esc(opts.submitLabel || 'Simpan') + '</button></div></form></div>';
    $('modal').classList.remove('hidden');
    var first = $('modal').querySelector('input:not([type=checkbox]), textarea'); if (first) first.focus();
    $('modal-form').onsubmit = async function (e) {
      e.preventDefault();
      var v = {};
      formFields.forEach(function (f) {
        var el = $('f_' + f.key);
        if (f.type === 'checkbox') v[f.key] = el.checked;
        else if (f.type === 'number') v[f.key] = el.value === '' ? null : Number(el.value);
        else v[f.key] = el.value.trim();
      });
      var btn = $('modal-submit'); btn.disabled = true; btn.textContent = 'Menyimpan…';
      try { await opts.onSubmit(v); closeModal(); } catch (err) { console.error(err); btn.disabled = false; btn.textContent = opts.submitLabel || 'Simpan'; }
    };
  }
  function closeModal() { $('modal').classList.add('hidden'); $('modal').innerHTML = ''; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  // ============================================================
  // Boot
  // ============================================================
  $('login-logo').innerHTML = icon('logo'); $('side-logo').innerHTML = icon('logo');
  $('logout-btn').innerHTML = icon('logout'); $('menu-toggle').innerHTML = icon('bars');
  $('global-search').innerHTML = icon('search') + '<input id="search-input" placeholder="Cari klien, lokasi, menu, feedback…" oninput="onSearch(this.value)">';
  (async function init() {
    var session = (await sb.auth.getSession()).data.session;
    if (session) start(); else showLogin();
  })();
</script>
</body>
